name: Cluster Scanner

on:
  #schedule:
    # Every 30 minutes, hours 13:00–21:30 UTC, Mon–Fri.
    # 13:00–21:30 UTC covers 9:00am–5:30pm ET across both EDT and EST,
    # so the market-hours check inside scanner.py handles the exact cutoff.
  #  - cron: "*/30 9-17 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit cluster_state.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Persist state and max-move data
        run: |
          git config user.name "cluster-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in cluster_state.json max_1d_moves_1y.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Nothing changed — nothing to commit."
          else
            git commit -m "update cluster state / 1Y max moves"
            git pull --rebase
            git push
          fi
